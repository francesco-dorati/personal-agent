[project]
name = "personal-agent"
version = "0.2.0"
description = "MCP server that lets an AI agent read and update a Notion-based personal life system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
agent = "personal_agent.cli:main"
agent-mcp = "personal_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]
